<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- VisionOS Glass background gradient -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0c0f15" stop-opacity="0.98" />
    </linearGradient>
    <!-- Razor-thin glass border highlight -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <!-- Crisp pure white with warm cream finish -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDFCEE" />
    </linearGradient>
    <!-- Fintask signature warm amber accent -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#E0A96D" />
    </linearGradient>
    <!-- Soft glow filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- VisionOS Glass Squircle -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#glassBg)" stroke="url(#glassBorder)" stroke-width="1.6" />
  <rect x="4" y="4" width="92" height="92" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

  <!-- Lowercase 'f' arch and stem -->
  <path 
    d="M 43 28 C 43 21.37 48.37 16 55 16 C 58.8 16 62 18 64 21" 
    stroke="url(#glyphGrad)" 
    stroke-width="7" 
    stroke-linecap="round" 
  />
  <path 
    d="M 43 23 L 43 78" 
    stroke="url(#glyphGrad)" 
    stroke-width="7" 
    stroke-linecap="round" 
  />

  <!-- Crossbar that sweeps into a precision checkmark -->
  <path 
    d="M 27 41 L 43 41 L 55 55 L 75 29" 
    stroke="url(#glyphGrad)" 
    stroke-width="7" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  <!-- Subtle Fintask amber pulse dot -->
  <circle cx="75" cy="18" r="4.5" fill="url(#amberGrad)" filter="url(#softGlow)" />
</svg>
